<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Lionel Messi caricature">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="96"/></clipPath>
    <clipPath id="shirt"><path d="M28 210 C32 166 62 150 100 150 C138 150 168 166 172 210 Z"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D3E3FA"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#0969DA"/>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- sky blue and white striped jersey -->
    <g clip-path="url(#shirt)">
      <rect x="20" y="140" width="160" height="70" fill="#FFFFFF"/>
      <rect x="38" y="140" width="18" height="70" fill="#75AADB"/>
      <rect x="74" y="140" width="18" height="70" fill="#75AADB"/>
      <rect x="110" y="140" width="18" height="70" fill="#75AADB"/>
      <rect x="146" y="140" width="18" height="70" fill="#75AADB"/>
    </g>
    <path d="M82 150 L100 168 L118 150" fill="none" stroke="#1F2A44" stroke-width="5" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M86 122 L86 152 L100 166 L114 152 L114 122 Z" fill="#D9A07A"/>
    <!-- ears -->
    <ellipse cx="64" cy="90" rx="8" ry="11" fill="#E0A982"/>
    <ellipse cx="136" cy="90" rx="8" ry="11" fill="#E0A982"/>
    <!-- face -->
    <ellipse cx="100" cy="88" rx="36" ry="42" fill="#EAB792"/>
    <!-- swept brown hair -->
    <path d="M62 82 C56 52 74 30 102 30 C128 30 146 48 140 82 C136 66 128 58 118 54 C108 60 86 62 70 58 C66 64 64 72 62 82 Z" fill="#4A2E1C"/>
    <path d="M70 58 C86 50 106 46 124 52" stroke="#6B4429" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- full beard -->
    <path d="M64 90 C64 120 80 136 100 136 C120 136 136 120 136 90 C132 104 126 110 120 112 C112 104 88 104 80 112 C74 110 68 104 64 90 Z" fill="#4A2E1C"/>
    <path d="M86 110 Q100 104 114 110 Q100 114 86 110 Z" fill="#4A2E1C"/>
    <!-- mouth -->
    <path d="M90 118 Q100 124 110 118" stroke="#F3E3D3" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M76 74 Q84 70 92 73" stroke="#3B2416" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M108 73 Q116 70 124 74" stroke="#3B2416" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- kind eyes -->
    <ellipse cx="84" cy="84" rx="4" ry="4.5" fill="#2A1A10"/>
    <ellipse cx="116" cy="84" rx="4" ry="4.5" fill="#2A1A10"/>
    <circle cx="85.5" cy="82.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="117.5" cy="82.5" r="1.3" fill="#FFFFFF"/>
    <!-- nose -->
    <path d="M100 88 C99 96 97 99 95 101 Q100 104 105 101" stroke="#C48A66" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
