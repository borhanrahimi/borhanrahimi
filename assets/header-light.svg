<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hey, I'm Borhan. Software developer who loves building apps.">
  <style>
    .tag { opacity: 0; animation: cycle 9s infinite; }
    .tag1 { animation-delay: 3s; }
    .tag2 { animation-delay: 6s; }
    @keyframes cycle {
      0% { opacity: 0; }
      4%, 30% { opacity: 1; }
      34%, 100% { opacity: 0; }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.55; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0969DA" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="glow1"><stop offset="0" stop-color="#0969DA" stop-opacity="0.35"/><stop offset="1" stop-color="#0969DA" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#8250DF" stop-opacity="0.3"/><stop offset="1" stop-color="#8250DF" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#1F2328"/><stop offset="1" stop-color="#0969DA"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#FFFFFF"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="glow" cx="930" cy="70" r="340" fill="url(#glow1)"/>
    <circle class="glow" cx="1150" cy="330" r="300" fill="url(#glow2)" style="animation-delay: 3s"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#D0D7DE"/>

  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#0969DA">SOFTWARE DEVELOPER · CS GRAD</text>
  <text x="70" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#name)">Hey, I'm Borhan</text>
  <text class="tag tag0" x="72" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#59636E">I love building apps</text>
  <text class="tag tag1" x="72" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#59636E">Always working on a new project</text>
  <text class="tag tag2" x="72" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#59636E">Web · Desktop · Mobile</text>
  <circle cx="78" cy="263" r="4" fill="#116329"/>
  <text x="92" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#59636E">San Antonio, TX</text>

  <g transform="translate(730 58)">
    <rect width="400" height="204" rx="12" fill="#F6F8FA" fill-opacity="0.92" stroke="#D0D7DE"/>
    <circle cx="22" cy="22" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="22" r="5" fill="#FEBC2E"/>
    <circle cx="58" cy="22" r="5" fill="#28C840"/>
    <text x="200" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636E">borhan.ts</text>
    <path d="M0 42 H400" stroke="#D0D7DE"/>
    <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#8250DF">const </tspan><tspan fill="#953800">borhan</tspan><tspan fill="#1F2328"> = {</tspan></text>
    <text x="24" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#1F2328">  loves</tspan><tspan fill="#1F2328">: </tspan><tspan fill="#0A3069">"building apps"</tspan><tspan fill="#1F2328">,</tspan></text>
    <text x="24" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#1F2328">  stack</tspan><tspan fill="#1F2328">: [</tspan><tspan fill="#0A3069">"TS"</tspan><tspan fill="#1F2328">, </tspan><tspan fill="#0A3069">"Python"</tspan><tspan fill="#1F2328">, </tspan><tspan fill="#0A3069">"Java"</tspan><tspan fill="#1F2328">],</tspan></text>
    <text x="24" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#1F2328">  basedIn</tspan><tspan fill="#1F2328">: </tspan><tspan fill="#0A3069">"San Antonio, TX"</tspan><tspan fill="#1F2328">,</tspan></text>
    <text x="24" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#1F2328">  shipping</tspan><tspan fill="#1F2328">: </tspan><tspan fill="#0969DA">true</tspan><tspan fill="#1F2328">,</tspan></text>
    <text x="24" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#1F2328">};</tspan></text>
    <rect class="cursor" x="48" y="194" width="9" height="3" fill="#0969DA"/>
  </g>
</svg>
