<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hey, I'm Borhan. Software developer who loves building apps.">
  <style>
    .tag { opacity: 0; animation: cycle 9s infinite; }
    .tag1 { animation-delay: 3s; }
    .tag2 { animation-delay: 6s; }
    @keyframes cycle {
      0% { opacity: 0; }
      4%, 30% { opacity: 1; }
      34%, 100% { opacity: 0; }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.55; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#58A6FF" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="glow1"><stop offset="0" stop-color="#58A6FF" stop-opacity="0.35"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#A371F7" stop-opacity="0.3"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#E6EDF3"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="glow" cx="930" cy="70" r="340" fill="url(#glow1)"/>
    <circle class="glow" cx="1150" cy="330" r="300" fill="url(#glow2)" style="animation-delay: 3s"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#30363D"/>

  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#58A6FF">SOFTWARE DEVELOPER · CS GRAD</text>
  <text x="70" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#name)">Hey, I'm Borhan</text>
  <text class="tag tag0" x="72" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">I love building apps</text>
  <text class="tag tag1" x="72" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">Always working on a new project</text>
  <text class="tag tag2" x="72" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">Web · Desktop · Mobile</text>
  <g transform="translate(72 251) scale(1.3)">
    <clipPath id="flag"><rect width="24" height="16" rx="2.5"/></clipPath>
    <g clip-path="url(#flag)">
      <rect width="24" height="8" fill="#FFFFFF"/>
      <rect y="8" width="24" height="8" fill="#BF0A30"/>
      <rect width="8" height="16" fill="#002868"/>
      <polygon points="4.00,4.80 4.76,6.95 7.04,7.01 5.24,8.40 5.88,10.59 4.00,9.30 2.12,10.59 2.76,8.40 0.96,7.01 3.24,6.95" fill="#FFFFFF"/>
    </g>
    <rect x="0.5" y="0.5" width="23" height="15" rx="2.5" fill="none" stroke="#30363D"/>
  </g>
  <text x="114" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8B949E">San Antonio, TX</text>

  <g transform="translate(730 58)">
    <rect width="400" height="204" rx="12" fill="#161B22" fill-opacity="0.92" stroke="#30363D"/>
    <circle cx="22" cy="22" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="22" r="5" fill="#FEBC2E"/>
    <circle cx="58" cy="22" r="5" fill="#28C840"/>
    <text x="200" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8B949E">borhan.ts</text>
    <path d="M0 42 H400" stroke="#30363D"/>
    <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#A371F7">const </tspan><tspan fill="#FFA657">borhan</tspan><tspan fill="#E6EDF3"> = {</tspan></text>
    <text x="24" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">  loves</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#A5D6FF">"building apps"</tspan><tspan fill="#E6EDF3">,</tspan></text>
    <text x="24" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">  stack</tspan><tspan fill="#E6EDF3">: [</tspan><tspan fill="#A5D6FF">"TS"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#A5D6FF">"Python"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#A5D6FF">"Java"</tspan><tspan fill="#E6EDF3">],</tspan></text>
    <text x="24" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">  basedIn</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#A5D6FF">"San Antonio, TX"</tspan><tspan fill="#E6EDF3">,</tspan></text>
    <text x="24" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">  shipping</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#58A6FF">true</tspan><tspan fill="#E6EDF3">,</tspan></text>
    <text x="24" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#E6EDF3">};</tspan></text>
    <rect class="cursor" x="48" y="194" width="9" height="3" fill="#58A6FF"/>
  </g>
</svg>
