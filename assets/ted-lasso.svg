<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Ted Lasso caricature">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="96"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2433"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#58A6FF"/>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- navy quarter-zip -->
    <path d="M28 210 C32 166 62 150 100 150 C138 150 168 166 172 210 Z" fill="#1F3A68"/>
    <path d="M80 148 L100 160 L120 148 L120 140 L80 140 Z" fill="#274A82"/>
    <path d="M100 160 L100 210" stroke="#C9D3E3" stroke-width="2"/>
    <!-- whistle on a lanyard -->
    <path d="M80 150 Q90 176 104 182 M120 150 Q114 170 106 180" stroke="#E23B3B" stroke-width="2.5" fill="none"/>
    <rect x="98" y="178" width="16" height="9" rx="4" fill="#C0C6CF"/>
    <!-- neck -->
    <rect x="86" y="120" width="28" height="24" fill="#E8B898"/>
    <!-- ears -->
    <ellipse cx="62" cy="92" rx="8" ry="11" fill="#EDBE9F"/>
    <ellipse cx="138" cy="92" rx="8" ry="11" fill="#EDBE9F"/>
    <!-- round friendly face -->
    <ellipse cx="100" cy="90" rx="38" ry="42" fill="#F4CDB0"/>
    <!-- brown hair poking out above the visor -->
    <path d="M64 70 C62 44 80 30 100 30 C120 30 138 44 136 70 Z" fill="#6B4A2E"/>
    <path d="M70 46 Q78 34 88 40 Q96 28 106 38 Q116 30 124 42 Q132 40 132 52" stroke="#7E5A39" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- visor -->
    <path d="M62 66 Q100 54 138 66 L138 72 Q100 62 62 72 Z" fill="#1F3A68"/>
    <path d="M60 70 Q100 60 140 70 Q150 74 146 78 Q100 70 54 78 Q50 74 60 70 Z" fill="#15294A"/>
    <!-- raised friendly brows -->
    <path d="M74 82 Q83 76 92 80" stroke="#5A3D25" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M108 80 Q117 76 126 82" stroke="#5A3D25" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- smiling squinted eyes -->
    <path d="M77 92 Q84 86 91 92" stroke="#2A1A10" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M109 92 Q116 86 123 92" stroke="#2A1A10" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- rosy cheeks -->
    <circle cx="76" cy="104" r="6" fill="#F2A08A" opacity="0.55"/>
    <circle cx="124" cy="104" r="6" fill="#F2A08A" opacity="0.55"/>
    <!-- nose -->
    <path d="M100 92 C98 100 96 103 94 104 Q100 107 106 104" stroke="#CFA083" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- the big mustache -->
    <path d="M70 116 C76 104 90 104 100 110 C110 104 124 104 130 116 C124 114 118 116 112 118 C106 120 104 116 100 115 C96 116 94 120 88 118 C82 116 76 114 70 116 Z" fill="#5A3D25"/>
    <!-- big grin -->
    <path d="M86 120 Q100 134 114 120 Q100 126 86 120 Z" fill="#FFFFFF" stroke="#8A4B3A" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
