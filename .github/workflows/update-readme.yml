name: Update README Projects

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs first: the README script versions every SVG it links to
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: borhanrahimi
          outputs: |
            assets/snake-light.svg?color_snake=#0969DA&color_dots=#EBEDF0,#B6D4F5,#7FB2EE,#3D8AE4,#0969DA
            assets/snake-dark.svg?color_snake=#58A6FF&color_dots=#21262D,#173A5E,#1F5591,#3A7FD0,#58A6FF

      - name: Update Featured Projects and Recently Worked On
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: borhanrahimi
        run: python3 .github/scripts/update_readme.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No README changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets

          git commit -m "Update README projects"

          git push
