name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Recently Worked On section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: borhanrahimi
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          README_PATH = "README.md"
          CONFIG_PATH = ".github/recent-projects.json"
          START_MARKER = "<!--RECENT_PROJECTS:start-->"
          END_MARKER = "<!--RECENT_PROJECTS:end-->"
          MAX_PROJECTS = 3

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": USERNAME,
          }

          def github_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          with open(CONFIG_PATH, "r", encoding="utf-8") as f:
              repo_config = json.load(f)

          events = github_get(
              f"https://api.github.com/users/{USERNAME}/events/public?per_page=100"
          )

          recent_unique_repos = []

          for event in events:
              if event.get("type") != "PushEvent":
                  continue

              repo_full_name = event.get("repo", {}).get("name", "")
              if not repo_full_name:
                  continue

              repo_name = repo_full_name.split("/")[-1]

              if repo_name not in repo_config:
                  continue

              if repo_name not in recent_unique_repos:
                  recent_unique_repos.append(repo_name)

              if len(recent_unique_repos) >= MAX_PROJECTS:
                  break

          lines = []
          for repo_name in recent_unique_repos:
              item = repo_config[repo_name]
              lines.append(f"**{item['name']}** — {item['stack']}")

          if not lines:
              # fallback: show configured projects in the order written in the json
              for repo_name, item in list(repo_config.items())[:MAX_PROJECTS]:
                  lines.append(f"**{item['name']}** — {item['stack']}")

          new_block = "\n".join(line + "  " for line in lines).rstrip()

          with open(README_PATH, "r", encoding="utf-8") as f:
              content = f.read()

          if START_MARKER not in content or END_MARKER not in content:
              raise RuntimeError("README markers not found.")

          before = content.split(START_MARKER)[0]
          after = content.split(END_MARKER)[1]

          updated = (
              before
              + START_MARKER
              + "\n"
              + new_block
              + "\n"
              + END_MARKER
              + after
          )

          with open(README_PATH, "w", encoding="utf-8") as f:
              f.write(updated)

          print("README updated successfully.")
          PY

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update recently worked on section"
          git push
