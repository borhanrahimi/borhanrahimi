name: Update Recently Worked On

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Recently Worked On section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: borhanrahimi
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          README_PATH = "README.md"

          START_MARKER = "<!--RECENT_PROJECTS:start-->"
          END_MARKER = "<!--RECENT_PROJECTS:end-->"

          MAX_PROJECTS = 3

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": USERNAME,
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          # Get recent public GitHub activity
          events = github_get(
              f"https://api.github.com/users/{USERNAME}/events/public?per_page=100"
          )

          recent_repositories = []

          for event in events:
              # Only look at pushes
              if event.get("type") != "PushEvent":
                  continue

              repo_full_name = event.get("repo", {}).get("name")

              if not repo_full_name:
                  continue

              repo_name = repo_full_name.split("/")[-1]

              # Don't show the GitHub profile repository itself
              if repo_name.lower() == USERNAME.lower():
                  continue

              # Avoid duplicates
              if repo_name not in recent_repositories:
                  recent_repositories.append(repo_name)

              if len(recent_repositories) >= MAX_PROJECTS:
                  break

          project_lines = []

          for repo_name in recent_repositories:
              try:
                  repo = github_get(
                      f"https://api.github.com/repos/{USERNAME}/{repo_name}"
                  )

                  language = repo.get("language") or "Project"

                  display_name = (
                      repo_name
                      .replace("-", " ")
                      .replace("_", " ")
                      .title()
                  )

                  repo_url = f"https://github.com/{USERNAME}/{repo_name}"

                  project_lines.append(
                      f"**[{display_name}]({repo_url})** — {language}"
                  )

              except Exception as error:
                  print(f"Could not load {repo_name}: {error}")

                  display_name = (
                      repo_name
                      .replace("-", " ")
                      .replace("_", " ")
                      .title()
                  )

                  repo_url = f"https://github.com/{USERNAME}/{repo_name}"

                  project_lines.append(
                      f"**[{display_name}]({repo_url})**"
                  )

          # If there are no recent public pushes
          if not project_lines:
              project_lines.append(
                  "No recent public project activity."
              )

          new_block = "\n".join(
              line + "  "
              for line in project_lines
          ).rstrip()

          with open(README_PATH, "r", encoding="utf-8") as file:
              content = file.read()

          if START_MARKER not in content:
              raise RuntimeError(
                  "Start marker not found in README."
              )

          if END_MARKER not in content:
              raise RuntimeError(
                  "End marker not found in README."
              )

          before = content.split(START_MARKER)[0]
          after = content.split(END_MARKER)[1]

          updated_content = (
              before
              + START_MARKER
              + "\n"
              + new_block
              + "\n"
              + END_MARKER
              + after
          )

          with open(README_PATH, "w", encoding="utf-8") as file:
              file.write(updated_content)

          print("README updated successfully.")
          print("Recent repositories:")
          for repo in recent_repositories:
              print(f"- {repo}")

          PY

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No README changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git commit -m "Update recently worked on projects"

          git push
